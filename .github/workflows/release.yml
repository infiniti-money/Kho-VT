name: Publish HISA official v0.1.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hisa-official-v0.1.6
  cancel-in-progress: false

jobs:
  release:
    name: Build, test and publish official Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ensure code version matches release tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content "HisaWarehouse.csproj"
          $version = $project.Project.PropertyGroup.Version
          if ($version -ne "0.1.6") {
            throw "Version $version is not v0.1.6. Refusing mismatched release."
          }

      - name: Build WPF application
        run: dotnet build HisaWarehouse.csproj --configuration Release --nologo

      - name: Test Excel locking
        run: dotnet run --project tests/WorkbookWriteSafety.SmokeTests/WorkbookWriteSafety.SmokeTests.csproj --configuration Release --nologo

      - name: Test original KHO workbook structure
        run: dotnet run --project tests/KhoWorkbookStructure.SmokeTests/KhoWorkbookStructure.SmokeTests.csproj --configuration Release --nologo

      - name: Test safe Excel append (input cells only)
        run: dotnet run --project tests/ExcelAppend.SmokeTests/ExcelAppend.SmokeTests.csproj --configuration Release --nologo

      - name: Test updater rollback boundaries and path protection
        run: dotnet run --project Updater/HisaUpdater.csproj --configuration Release -- --self-test

      - name: Test single-active-workspace navigation
        run: dotnet run --project tests/WorkspaceNavigation.SmokeTests/WorkspaceNavigation.SmokeTests.csproj --configuration Release --nologo

      - name: Test grouped business navigation structure
        run: dotnet run --project tests/SidebarModules.SmokeTests/SidebarModules.SmokeTests.csproj --configuration Release --nologo

      - name: Regression tests for Vietnamese PCM voice activity
        run: dotnet run --project tests/PcmVoiceActivity.SmokeTests/PcmVoiceActivity.SmokeTests.csproj --configuration Release --nologo

      - name: Publish self-contained Windows app
        run: dotnet publish HisaWarehouse.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output publish-reconciled --nologo

      - name: Publish standalone updater
        run: dotnet publish Updater/HisaUpdater.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output updater-publish --nologo

      - name: Package app and ZIP
        shell: pwsh
        run: |
          Copy-Item "updater-publish/HISA.Updater.exe" "publish-reconciled/HISA.Updater.exe" -Force
          $required = @(
            "publish-reconciled/HISA Quan Ly Kho.exe",
            "publish-reconciled/HISA.Updater.exe",
            "publish-reconciled/data/initial_data.json",
            "publish-reconciled/Web/charts.html",
            "publish-reconciled/Assets/hisa.ico"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing file: $path" }
          }
          Compress-Archive -Path "publish-reconciled/*" -DestinationPath "HISA-KhoVT-Windows-x64.zip" -CompressionLevel Optimal

      - name: Install Inno Setup compiler if missing
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Cannot install Inno Setup compiler" }
          }

      - name: Build Vietnamese EXE installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler missing" }
          & $compiler "/DMyAppVersion=0.1.6" "installer/HisaKho.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup returned $LASTEXITCODE" }
          if (-not (Test-Path "installer-output/HISA-KhoVT-Setup.exe")) { throw "Installer output missing" }

      - name: Generate public SHA-256 manifest
        shell: pwsh
        run: |
          $files = @("installer-output/HISA-KhoVT-Setup.exe", "HISA-KhoVT-Windows-x64.zip")
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path (Get-Location) "SHA256SUMS.txt"),
            [string[]]$lines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Publish official GitHub Release and attach files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v0.1.6" --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "v0.1.6 already exists. Not overwriting official assets."
            exit 0
          }
          gh release create "v0.1.6" `
            "installer-output/HISA-KhoVT-Setup.exe#HISA-KhoVT-Setup.exe" `
            "HISA-KhoVT-Windows-x64.zip#HISA-KhoVT-Windows-x64.zip" `
            "SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "HISA Kho-VT v0.1.6 — Bản chính thức" `
            --notes-file "docs/RELEASE_v0.1.6.md" `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed" }
