name: Replenishment Windows build

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/replenishment-proposals]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build WPF project
        run: dotnet build HisaWarehouse.csproj --configuration Release --nologo
      - name: Publish Windows x64
        run: dotnet publish HisaWarehouse.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output publish-reconciled --nologo
      - name: Verify publish contents
        shell: pwsh
        run: |
          $required = @(
            "publish-reconciled/HISA Quan Ly Kho.exe",
            "publish-reconciled/data/initial_data.json",
            "publish-reconciled/Web/charts.html"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing output: $file" }
          }
