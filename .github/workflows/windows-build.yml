name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build WPF application
        run: dotnet build HisaWarehouse.csproj --configuration Release --nologo

      - name: Test Excel file access and conflict detection
        run: dotnet run --project tests/WorkbookWriteSafety.SmokeTests/WorkbookWriteSafety.SmokeTests.csproj --configuration Release --nologo

      - name: Test original KHO.xlsx sheet and formula validation
        run: dotnet run --project tests/KhoWorkbookStructure.SmokeTests/KhoWorkbookStructure.SmokeTests.csproj --configuration Release --nologo

      - name: Smoke test offline updater and safe file replacement
        run: dotnet run --project Updater/HisaUpdater.csproj --configuration Release -- --self-test

      - name: Test single-active-workspace navigation
        run: dotnet run --project tests/WorkspaceNavigation.SmokeTests/WorkspaceNavigation.SmokeTests.csproj --configuration Release --nologo

      - name: Test grouped business navigation structure
        run: dotnet run --project tests/SidebarModules.SmokeTests/SidebarModules.SmokeTests.csproj --configuration Release --nologo

      - name: Publish self-contained Windows application
        run: dotnet publish HisaWarehouse.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output publish-reconciled --nologo

      - name: Publish standalone updater
        run: dotnet publish Updater/HisaUpdater.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output updater-publish --nologo

      - name: Include updater in Windows app package
        shell: pwsh
        run: Copy-Item "updater-publish/HISA.Updater.exe" "publish-reconciled/HISA.Updater.exe" -Force

      - name: Check published files
        shell: pwsh
        run: |
          $required = @(
            "publish-reconciled/HISA Quan Ly Kho.exe",
            "publish-reconciled/data/initial_data.json",
            "publish-reconciled/Web/charts.html",
            "publish-reconciled/Assets/hisa_logo.png",
            "publish-reconciled/Assets/hisa.ico",
            "publish-reconciled/HISA.Updater.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing published file: $path"
            }
          }
          Write-Host "Build output includes executable and required runtime data."

      - name: Create ZIP package compatible with future GitHub Releases
        shell: pwsh
        run: Compress-Archive -Path "publish-reconciled/*" -DestinationPath "HISA-KhoVT-Windows-x64.zip" -CompressionLevel Optimal

      - name: Upload release-format ZIP for future publishing
        uses: actions/upload-artifact@v4
        with:
          name: HISA-KhoVT-Release-ZIP-PREVIEW
          path: HISA-KhoVT-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Install Inno Setup compiler if missing
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Cannot install Inno Setup compiler" }
          }

      - name: Build Vietnamese Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup Compiler not found: $compiler" }
          [xml]$project = Get-Content "HisaWarehouse.csproj"
          $version = $project.Project.PropertyGroup.Version
          & $compiler "/DMyAppVersion=$version" "installer/HisaKho.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with code $LASTEXITCODE" }
          if (-not (Test-Path "installer-output/HISA-KhoVT-Setup.exe")) { throw "Setup EXE not found" }

      - name: Upload Vietnamese installer preview
        uses: actions/upload-artifact@v4
        with:
          name: HISA-KhoVT-Vietnamese-Installer-EXE-PREVIEW
          path: installer-output/HISA-KhoVT-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows test build (not an installer)
        uses: actions/upload-artifact@v4
        with:
          name: HISA-KhoVT-AI-Windows-x64-preview
          path: publish-reconciled/
          if-no-files-found: error
          retention-days: 7
