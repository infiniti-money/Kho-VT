<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biểu đồ tồn kho · HISA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; font-family: "Segoe UI", Arial, sans-serif; color: #172b45; }
    body { padding: 12px; }
    .charts { display: grid; grid-template-columns: 0.82fr 1.6fr; gap: 12px; height: 100%; }
    .chart-card { min-width: 0; display: flex; flex-direction: column; border: 1px solid #e8edf3; border-radius: 10px; padding: 15px 16px 12px; }
    .chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .title { font-size: 13px; font-weight: 700; letter-spacing: .1px; }
    .subtitle { color: #8593a5; font-size: 10px; margin-top: 4px; }
    .selects { display: flex; gap: 7px; }
    select { color: #52657e; background: #fff; border: 1px solid #e0e7f0; border-radius: 6px; padding: 5px 7px; font-size: 10px; outline: none; max-width: 140px; }
    .canvas-wrap { flex: 1; min-height: 0; position: relative; }
    #categoryChart { max-height: 208px; }
    .chart-foot { color: #94a0b0; font-size: 9px; margin-top: 5px; }
    @media (max-width: 900px) { .charts { grid-template-columns: 1fr; overflow-y: auto; } .chart-card { min-height: 260px; } }
  </style>
</head>
<body>
  <div class="charts">
    <section class="chart-card">
      <div class="chart-head">
        <div><div class="title">Phân bố danh mục</div><div class="subtitle">Số mã hàng đang còn tồn trong các kho đã chọn</div></div>
      </div>
      <div class="canvas-wrap"><canvas id="categoryChart" aria-label="Biểu đồ phân bố danh mục"></canvas></div>
      <div class="chart-foot">Chọn một nhóm trên biểu đồ để lọc danh mục tồn kho.</div>
    </section>
    <section class="chart-card">
      <div class="chart-head">
        <div><div class="title">Xu hướng luân chuyển kho</div><div class="subtitle" id="trendSubtitle">Số dòng phiếu theo tháng</div></div>
        <div class="selects">
          <select id="trendPeriod" aria-label="Khoảng thời gian"><option value="90">90 ngày</option><option value="180" selected>6 tháng</option><option value="365">12 tháng</option><option value="0">Toàn bộ</option></select>
          <select id="trendUnit" aria-label="Đơn vị tính"></select>
        </div>
      </div>
      <div class="canvas-wrap"><canvas id="trendChart" aria-label="Biểu đồ xu hướng nhập xuất"></canvas></div>
      <div class="chart-foot">Tất cả đơn vị: so sánh số dòng giao dịch. Chọn đơn vị để xem số lượng cùng đơn vị.</div>
    </section>
  </div>
  <script src="../static/vendor/chart.umd.min.js"></script>
  <script src="charts.js"></script>
</body>
</html>
